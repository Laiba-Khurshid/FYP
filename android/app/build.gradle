plugins {
    id "com.android.application"
    id "kotlin-android"                       // ✅ MUST include this
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

android {
    namespace = "com.example.fprojects"
    compileSdk = 34                           // You can upgrade to 36 later

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"                      // Must match Java version
    }

    defaultConfig {
        applicationId = "com.example.fprojects"
        minSdk = flutter.minSdkVersion        // ✅ no "Version" suffix, no "=" assignment
        targetSdk = 34
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.getByName("debug")
        }
    }
}

flutter {
    source = "../.."
}